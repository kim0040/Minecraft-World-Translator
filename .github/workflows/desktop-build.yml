name: desktop-build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Package sidecar without a localhost server
        run: |
          pyinstaller --noconfirm --clean --onefile --name PomiTranslate \
            --paths . \
            --hidden-import nbt \
            --hidden-import lz4.block \
            --hidden-import keyring \
            --hidden-import mwt.desktop_entry \
            --hidden-import mc_world_translator \
            --hidden-import llm_backends \
            --hidden-import env_utils \
            packaging/pomi_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: pomitranslate-linux-x64
          path: dist/PomiTranslate
