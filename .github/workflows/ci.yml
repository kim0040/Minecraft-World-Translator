name: ci

# Automatic core checks are limited to Python/dependency changes on main or PRs into main.
# Browser/frontend tests are verified locally and must not trigger the Python suite.
# Packaging is manual/release-tag only; see docs/ci-policy.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Core regression
        run: python test_core.py
      - name: Compatibility fixtures
        run: python tests/test_release_fixtures.py
      - name: Brand and secret surfaces
        run: python tests/test_brand_secrets.py
      - name: Desktop entry
        run: python tests/test_desktop_entry.py
      - name: Providers and remembered settings
        run: python tests/test_providers.py
      - name: Desktop credential routing boundary
        run: python tests/test_desktop_provider.py
      - name: Settings validation and recovery
        run: python tests/test_settings_transaction.py
      - name: Scan scope settings
        run: python tests/test_scan_settings.py
      - name: Provider usage and credential redaction
        run: python tests/test_desktop_usage.py
      - name: Desktop prompt enhancement
        run: python tests/test_desktop_prompt.py
      - name: Safe legacy settings preview
        run: python tests/test_legacy_settings_import.py
      - name: Desktop overrides and file write policy
        run: python tests/test_desktop_parity.py
      - name: Resource pack settings and safe preflight
        run: |
          python tests/test_resource_pack_settings.py
          python tests/test_resource_pack_preflight.py
      - name: World input path containment
        run: python tests/test_world_path_boundary.py
      - name: Explicit external ZIP scan and restore
        run: python tests/test_desktop_external_packs.py
      - name: Cancellation usage reporting
        run: python tests/test_cancelled_usage.py
      - name: Failure reporting and retry
        run: python tests/test_reliability.py
      - name: Text extraction and NBT round trip
        run: python tests/test_extraction.py
