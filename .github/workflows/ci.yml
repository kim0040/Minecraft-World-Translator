name: ci

# Runs only where it protects something: a pull request into main, or a push to main. Pushes to a
# feature branch run nothing until a pull request exists. Docs, images and the UI do not touch the
# Python core, so they do not start it. A newer run replaces one still going for the same ref.
on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Core regression
        run: python test_core.py
      - name: Compatibility fixtures
        run: python tests/test_release_fixtures.py
      - name: Brand and secret surfaces
        run: python tests/test_brand_secrets.py
      - name: Desktop entry
        run: python tests/test_desktop_entry.py
      - name: Providers and remembered settings
        run: python tests/test_providers.py
      - name: Failure reporting and retry
        run: python tests/test_reliability.py
      - name: Text extraction and NBT round trip
        run: python tests/test_extraction.py
