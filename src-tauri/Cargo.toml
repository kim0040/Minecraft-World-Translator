[package]
name = "pomitranslate"
version = "0.1.0"
description = "PomiTranslate desktop application"
authors = ["PomiTranslate contributors"]
edition = "2021"

[lib]
name = "pomitranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "=4.2.0"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-shell = "=2.4.0"
tauri-plugin-single-instance = "=2.5.0"
