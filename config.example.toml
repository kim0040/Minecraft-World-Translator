# Required. Point this at a Minecraft Java world folder.
world_dir = "./world"

# Optional. Leave empty to use the default location:
# real runs write inside the world; scans write under ./translation_reports/<world>/.
report_path = ""
dry_run = false
backup = true
backup_suffix = ".bak_translate"
batch_size = 40
temperature = 0.3

# If true, empty API/model/base_url values fall back to translate.py after env vars.
inherit_translate_py = true
translate_py_path = "./translate.py"

[api]
# Supported: comet, openai, gemini, anthropic, openrouter, custom_openai, custom_anthropic
provider = "comet"

# Resolution order: this value → provider-specific env var → translate.py (if inherit is on).
api_key = ""
base_url = "https://api.cometapi.com/v1"
model = ""
request_timeout = 120
rpm_limit = 0
tpm_limit = 0

[prompt]
target_language = "한국어"
style_preset = "neutral"

# Extra style instructions appended after the preset.
# Ignored when custom_system_prompt is set.
style_prompt = ""

# If you set this, it replaces the preset and extra style instructions entirely.
custom_system_prompt = ""

[scan]
region_dirs = [
  "region",
  "entities",
  "DIM-1/region",
  "DIM-1/entities",
  "DIM1/region",
  "DIM1/entities",
]

skip_patterns = ["*.bak_translate"]

translate_signs = true
translate_books = true
translate_custom_names = true
translate_item_names = true
translate_lore = true
translate_titles = true
translate_filtered_titles = true
translate_command_output = true

# If true, strings that look like raw commands such as /kill @p are skipped.
skip_command_like_text = true

# If a text component uses {"translate":"prefix.some_key"} and the prefix matches,
# the tool can turn the key into text and translate that as a fallback.
component_translate_key_prefixes = []

[scan.overrides]
# Optional exact replacements: "Source text" = "Translated text"

[resource_pack]
enabled = false

# Relative paths are resolved from world_dir.
zip_paths = ["./resources.zip"]

source_lang_files = ["en_us.json", "zh_cn.json"]
target_lang_file = "ko_kr.json"

# If true, existing target language files in the zip are left untouched.
skip_if_target_exists = false

[runtime]
checkpoint_enabled = true
checkpoint_path = ""
resume_from_checkpoint = false
continue_on_file_error = true
max_batch_retries = 3
max_file_write_retries = 2
